<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Rose:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dist/styles.css">
  <script type="module" src="dist/js/main.js"></script>
</head>
<body>

<main class="app">

  <section class="screen screen--home" id="screen-home" aria-label="Start screen" hidden>

    <div class="home">
      <p class="home__eyebrow">It's play time.</p>
      <h1 class="home__title">Ready to play?</h1>

      <button class="btn btn--play">
        <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" x2="10" y1="11" y2="11" />
          <line x1="8" x2="8" y1="9" y2="13" />
          <line x1="15" x2="15.01" y1="12" y2="12" />
          <line x1="18" x2="18.01" y1="10" y2="10" />
          <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.544-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z" />
        </svg>
        Play
        <span class="btn__arrow">&rarr;</span>
      </button>
    </div>

    <svg class="home__watermark" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="6" x2="10" y1="11" y2="11" />
      <line x1="8" x2="8" y1="9" y2="13" />
      <line x1="15" x2="15.01" y1="12" y2="12" />
      <line x1="18" x2="18.01" y1="10" y2="10" />
      <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.544-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z" />
    </svg>

  </section>

  <section class="screen screen--settings" id="screen-settings" aria-label="Game settings" hidden>
    <div class="settings">

      <h1 class="settings__title">Settings</h1>

      <div class="settings__body">

        <form class="settings__form">

          <div class="group">
            <h2 class="group__title">
              <svg class="group__icon group__icon--themes" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" />
                <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" />
                <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" />
                <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" />
                <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z" />
              </svg>
              Game themes
            </h2>
            <label class="option">
              <input type="radio" name="theme" value="code-vibes">
              <span class="option__text">Code vibes theme</span>
              <span class="option__arrow"></span>
            </label>
            <label class="option">
              <input type="radio" name="theme" value="gaming">
              <span class="option__text">Gaming theme</span>
              <span class="option__arrow"></span>
            </label>
            <label class="option">
              <input type="radio" name="theme" value="foods">
              <span class="option__text">Foods theme</span>
              <span class="option__arrow"></span>
            </label>
          </div>

          <div class="group">
            <h2 class="group__title">
              <svg class="group__icon group__icon--player" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2a3 3 0 0 0-1.9 5.32C9.42 8.02 9 9 9 10c0 1.13.47 2.15 1.22 2.88L9 19h6l-1.22-6.12A3.99 3.99 0 0 0 15 10c0-1-.42-1.98-1.1-2.68A3 3 0 0 0 12 2z" />
                <path d="M7.5 20h9v2h-9z" />
              </svg>
              Choose player
            </h2>
            <label class="option">
              <input type="radio" name="player" value="blue">
              <span class="option__text">Blue</span>
              <span class="option__arrow"></span>
            </label>
            <label class="option">
              <input type="radio" name="player" value="orange">
              <span class="option__text">Orange</span>
              <span class="option__arrow"></span>
            </label>
          </div>

          <div class="group">
            <h2 class="group__title">
              <svg class="group__icon group__icon--size" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="8" y="4" width="10" height="15" rx="2" transform="rotate(9 13 11)" />
                <rect x="5" y="5" width="10" height="15" rx="2" transform="rotate(-6 10 12)" />
              </svg>
              Board size
            </h2>
            <label class="option">
              <input type="radio" name="size" value="4x4">
              <span class="option__text">16 cards</span>
              <span class="option__arrow"></span>
            </label>
            <label class="option">
              <input type="radio" name="size" value="4x6">
              <span class="option__text">24 cards</span>
              <span class="option__arrow"></span>
            </label>
            <label class="option">
              <input type="radio" name="size" value="6x6">
              <span class="option__text">36 cards</span>
              <span class="option__arrow"></span>
            </label>
          </div>

        </form>

        <div class="settings__side">

          <div class="preview">

            <div class="preview__bar">
              <span class="preview__score">Blue 0 &nbsp; Orange 6</span>
              <span>Current player: <b class="preview__player">-</b></span>
              <span class="preview__exit">Exit game</span>
            </div>

            <div class="preview__cards">
              <div class="preview__card preview__card--back">
                <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5"
                     stroke-linecap="round" stroke-linejoin="round">
                  <rect x="8" y="12" width="32" height="22" rx="3" />
                  <path d="M21 20l-4 3 4 3" />
                  <path d="M27 20l4 3-4 3" />
                </svg>
              </div>
              <div class="preview__card preview__card--front">
                <img class="preview__motif" src="" alt="" hidden>
              </div>
            </div>

          </div>

          <div class="breadcrumb">
            <span class="breadcrumb__step" data-step="theme">Game theme</span>
            <span class="breadcrumb__sep"></span>
            <span class="breadcrumb__step" data-step="player">Player</span>
            <span class="breadcrumb__sep"></span>
            <span class="breadcrumb__step" data-step="size">Board size</span>
            <button class="btn btn--start" disabled>&#9654; Start</button>
          </div>

        </div>

      </div>
    </div>
  </section>

  <section class="screen screen--game" id="screen-game" aria-label="Game board" hidden>
    <div class="game">

      <div class="topbar">

        <div class="topbar__scores">
          <span class="scorecard" data-player="blue">
            Blue <b class="scorecard__value">0</b>
          </span>
          <span class="scorecard" data-player="orange">
            Orange <b class="scorecard__value">0</b>
          </span>
        </div>

        <p class="topbar__turn">
          Current player: <b class="topbar__player">Blue</b>
        </p>

        <button class="btn btn--exit" type="button">Exit game</button>

      </div>

      <!-- the cards are dealt in from the card template below -->
      <div class="board" role="group" aria-label="Memory board"></div>

    </div>
  </section>

</main>

<!-- one card, stamped out once per card on the board -->
<template class="card-template">
  <button class="card" type="button">
    <span class="card__inner">
      <span class="card__face card__face--back" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="8" y="12" width="32" height="22" rx="3" />
          <path d="M21 20l-4 3 4 3" />
          <path d="M27 20l4 3-4 3" />
        </svg>
      </span>
      <span class="card__face card__face--front">
        <img class="card__motif" src="" alt="">
      </span>
    </span>
  </button>
</template>

</body>
</html>
